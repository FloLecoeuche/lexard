[project]
name = "lexard"
version = "0.1.0"
description = "AI Contract Analyst - Sovereign B2B RAG solution for contract analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.40",
    "sentence-transformers>=2.2.0",
    "qdrant-client>=1.7.0",
    "pdfminer.six>=20221105",
    "python-docx>=1.1.0",
    "tiktoken>=0.5.0",
    "python-multipart>=0.0.6",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
