# Lexard Docker Compose
#
# NOTE: llama-server with Vulkan runs on the HOST (not in Docker) because:
# - ROCm HIP backend has 100% idle GPU bug on RDNA4 (gfx1201)
# - Vulkan backend requires host GPU access that's simpler outside Docker
#
# Start llama-server on host first:
#   cd /tmp/llama.cpp && GGML_VK_DEVICE=0 ./build/bin/llama-server \
#     -m /tmp/mistral-7b-instruct-v0.2.Q4_K_M.gguf \
#     --host 0.0.0.0 --port 8080 -ngl 99
#
# Then: docker-compose up -d

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexard-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/6333"']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexard-api
    ports:
      - '8000:8000'
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - CONFIG_PATH=/app/config/config.docker.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access host llama-server
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  qdrant_data:
