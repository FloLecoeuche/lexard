# Lexard Configuration Template
# Copy this file to config.yaml and adjust values as needed
# All settings can be overridden via environment variables with prefix LEXARD_
# Example: LEXARD_APP__ENVIRONMENT=production

app:
  name: 'Lexard'
  environment: 'development'  # development | production
  log_level: 'info'  # debug | info | warning | error

llm:
  provider: 'ollama'
  model: 'mistral:7b-instruct'
  base_url: 'http://localhost:11434'
  temperature: 0.1
  max_tokens: 2048
  timeout_seconds: 30

embeddings:
  model: 'intfloat/multilingual-e5-base'
  batch_size: 32
  device: 'cpu'  # cpu | cuda
  query_prefix: 'query: '
  document_prefix: 'passage: '

chunking:
  method: 'fixed'
  size: 512
  overlap: 50

qdrant:
  host: 'localhost'
  port: 6333
  collection: 'documents'

retrieval:
  top_k: 8
  score_threshold: 0.7
  rerank: false

guardrails:
  hallucination_threshold: 0.8
  enable_pii_filter: true
  max_retries: 2

storage:
  upload_dir: './data/uploads'
  max_file_size_mb: 50

server:
  host: '0.0.0.0'
  port: 8000
  workers: 4

admin:
  analytics_password: 'change-me-in-production'  # MUST be changed in production
  dashboard_path: 'metrics-a7x9k2'  # Non-obvious path segment
