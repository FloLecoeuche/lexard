metadata:
  name: "Contract QA Evaluation"
  version: "1.0"
  description: "Test cases for contract question answering quality evaluation"

test_cases:
  # =============================================================================
  # Category: Termination Clauses
  # =============================================================================
  - id: "qa_001"
    category: "termination"
    document: "test_contract.pdf"
    question: "What is the termination notice period?"
    expected:
      behavior: "answer"
      answer_contains: ["days", "notice"]
      must_have_citations: true
      min_confidence: "medium"
    description: "Basic termination clause question"
    tags: ["basic", "termination"]

  - id: "qa_002"
    category: "termination"
    document: "test_contract.pdf"
    question: "Under what conditions can the contract be terminated early?"
    expected:
      behavior: "answer"
      must_have_citations: true
    description: "Early termination conditions"
    tags: ["termination", "conditions"]

  - id: "qa_003"
    category: "termination"
    document: "test_contract.pdf"
    question: "What happens to ongoing obligations after termination?"
    expected:
      behavior: "answer"
      must_have_citations: true
    description: "Post-termination obligations"
    tags: ["termination", "obligations"]

