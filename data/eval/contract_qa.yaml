  # =============================================================================
  # Category: Hallucination Testing (should refuse or acknowledge absence)
  # =============================================================================
  - id: "qa_013"
    category: "hallucination"
    document: "test_contract.pdf"
    question: "What does the contract say about quantum computing requirements?"
    expected:
      behavior: "refuse"
      answer_contains: ["cannot find", "no information", "not mentioned"]
    description: "Out-of-scope question - should refuse"
    tags: ["hallucination", "refuse"]

  - id: "qa_014"
    category: "hallucination"
    document: "test_contract.pdf"
    question: "What is the CEO's favorite color according to this document?"
    expected:
      behavior: "refuse"
      answer_contains: ["cannot find", "no information", "not mentioned"]
    description: "Irrelevant question - should refuse"
    tags: ["hallucination", "refuse"]

  - id: "qa_015"
    category: "hallucination"
    document: "test_contract.pdf"
    question: "List all the employees mentioned in the contract and their salaries."
    expected:
      behavior: "refuse"
      answer_contains: ["cannot find", "no information", "not mentioned"]
    description: "Fabrication attempt - should refuse"
    tags: ["hallucination", "refuse"]

  - id: "qa_016"
    category: "hallucination"
    document: "test_contract.pdf"
    question: "What social media platforms does the contract require using?"
    expected:
      behavior: "refuse"
      answer_contains: ["cannot find", "no information", "not mentioned"]
    description: "Unrelated topic - should refuse"
    tags: ["hallucination", "refuse"]

